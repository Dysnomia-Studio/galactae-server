kind: pipeline
name: galactae-server

steps:
- name: tests
  image: node
  commands:
  - npm install
  - npx istanbul cover --report lcovonly --dir reports/ node_modules/mocha/bin/_mocha -- --recursive test/ --color

- name: sonarqube
  image: aosapps/drone-sonar-plugin
  settings:
    sonar_host: ***REMOVED***
    sonar_token: ***REMOVED***
    level: DEBUG

- name: discord
  pull: default
  image: appleboy/drone-discord
  webhook_id: ***REMOVED***
  webhook_token: ***REMOVED***
  when:
    event: [ push ]
    status: [ changed, failure, success ]
  message: >
    {{#success build.status}}
      build {{repo.name}} {{build.branch}} {{build.number}} succeeded.
    {{else}}
      build {{repo.name}} {{build.branch}} {{build.number}} failed.
    {{/success}}