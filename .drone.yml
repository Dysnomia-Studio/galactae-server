kind: pipeline
name: galactae-server

steps:
- name: tests
  image: node
  commands:
  - npm install
  - npx istanbul cover --report lcovonly --dir reports/ node_modules/mocha/bin/_mocha -- --recursive test/ --color

- name: sonarqube
  image: aosapps/drone-sonar-plugin
  settings:
    sonar_host: ***REMOVED***
    sonar_token: ***REMOVED***
    level: TRACE
    showProfiling: true
  when:
    branch:
    - master

- name: discord
  pull: default
  image: appleboy/drone-discord
  settings:
    webhook_id: ***REMOVED***
    webhook_token: ***REMOVED***
    message: >
      {{#success build.status}}
        Build **{{repo.name}}** on branch **{{build.branch}}** ({{truncate build.commit 8}}) succeeded.
      {{else}}
        Build **{{repo.name}}** on branch **{{build.branch}}** ({{truncate build.commit 8}}) failed.
      {{/success}}
  when:
    event:
    - push
    status: 
    - changed
    - failure
    - success