kind: pipeline
name: galactae-server

steps:
- name: tests
  image: node
  commands:
  - npm install
  - npx istanbul cover --report lcovonly --dir server/reports/ "npx mocha" -- --recursive server/test/ --watch

- name: sonarqube
  image: aosapps/drone-sonar-plugin
  settings:
    sonar_host:
      from_secret: ***REMOVED***
    sonar_token:
      from_secret: ***REMOVED***