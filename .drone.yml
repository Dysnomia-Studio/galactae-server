kind: pipeline
name: galactae-server

steps:
- name: tests
  image: node
  commands:
  - npm install
  - npm test

- name: sonarqube
  image: aosapps/drone-sonar-plugin
  settings:
    sonar_host: ***REMOVED***
    sonar_token: ***REMOVED***
    level: TRACE
    showProfiling: true
  when:
    branch:
    - dev

- name: docker
  image: plugins/docker
  volumes:
  - name: docker_sock
    path: /var/run/docker.sock
  settings:
    repo: dysnomia/galactae-server
    dockerfile: Dockerfile
    tags: ${DRONE_BRANCH}
    dry_run: true
    pull-image: false
  environment:
    PLUGIN_PULL_IMAGE: false

  when:
    event:
    - push

- name: discord
  pull: default
  image: appleboy/drone-discord
  settings:
    webhook_id: ***REMOVED***
    webhook_token: ***REMOVED***
    message: >
      {{#success build.status}}
        Build **{{repo.name}}** on branch **${DRONE_BRANCH}** succeeded.
      {{else}}
        Build **{{repo.name}}** on branch **${DRONE_BRANCH}** failed.
      {{/success}}
  when:
    event:
    - push
    status: 
    - changed
    - failure
    - success