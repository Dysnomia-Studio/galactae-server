kind: pipeline
name: galactae-server

steps:
- name: tests
  image: node
  commands:
  - npm install
  - npx istanbul cover --report lcovonly --dir server/reports/ node_modules/mocha/bin/_mocha -- --recursive test/ --color

- name: sonarqube
  image: aosapps/drone-sonar-plugin
  settings:
    sonar_host:
      from_secret: ***REMOVED***
    sonar_token:
      from_secret: ***REMOVED***