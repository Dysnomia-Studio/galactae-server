name: Build & Test

on: [push, pull_request]

permissions:
  packages: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
    - name: Private packages auth
      run: echo -e "@dysnomia-studio:registry=https://npm.pkg.github.com/\n//npm.pkg.github.com/:_authToken=${{secrets.GHP_TOKEN}}" > .npmrc
    - run: npm ci
    - run: npm test

    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    - name: SonarQube Quality Gate check
      uses: sonarsource/sonarqube-quality-gate-action@master
      # Force to fail step after specific time
      timeout-minutes: 5
      env:
       SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build_tag:
    if: startsWith(github.event.ref, 'refs/tags/')
    needs: test
  
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6.3.0
        with:
          push: true
          tags: ghcr.io/dysnomia-studio/galactae-server:${{github.ref_name}}
          build-args: |
            NPM_TOKEN=${{secrets.GITHUB_TOKEN}}  
  
  build_branch:
    if: ${{ (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/')) && github.event_name == 'push' }}
    needs: test
  
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6.3.0
        with:
          push: true
          tags: ghcr.io/dysnomia-studio/galactae-server:${{ github.head_ref || github.ref_name }} 
          build-args: |
            NPM_TOKEN=${{secrets.GITHUB_TOKEN}}  
