name: Build & Test

on: [push]

permissions:
  packages: write
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dysnomia-studio/galactae-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'npm'
    - name: Private packages auth
      run: echo -e "@dysnomia-studio:registry=https://npm.pkg.github.com/\n//npm.pkg.github.com/:_authToken=${{secrets.GHP_TOKEN}}" > .npmrc
    - run: npm ci
    - run: npm test

    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    - name: SonarQube Quality Gate check
      uses: sonarsource/sonarqube-quality-gate-action@master
      # Force to fail step after specific time
      timeout-minutes: 5
      env:
       SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    needs: test
  
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set env.DOCKER_TAG / env.DOCKER_IMAGE_PUSH
        run:
          if [[ "${{ startsWith(github.event.ref, 'refs/tags/') }}" == "true" ]]; then
            echo "DOCKER_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.head_ref || github.ref_name }}" >> $GITHUB_ENV;
            echo "DOCKER_IMAGE_PUSH=true"  >> $GITHUB_ENV;
          else
            echo "DOCKER_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:temp" >> $GITHUB_ENV;
            echo "DOCKER_IMAGE_PUSH=false"  >> $GITHUB_ENV;
          fi

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          push: ${{ env.DOCKER_IMAGE_PUSH }}
          tags: ${{ env.DOCKER_TAG }}
          build-args: |
            NPM_TOKEN=${{secrets.GITHUB_TOKEN}}  
 
  deploy_app:
    needs: build
    if: startsWith(github.event.ref, 'refs/tags/')

    runs-on: ubuntu-latest
    steps:
      - name: Update infra
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.UPDATE_INFRA_TOKEN }}
          repository: Dysnomia-studio/argocd-infra
          event-type: update-infra